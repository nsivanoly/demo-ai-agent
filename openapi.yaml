openapi: 3.0.3
info:
  title: Demo 2 Payments Agent
  version: 2.0.0
  description: >-
    Confidential-tier specialist for the WSO2 Agent Manager identity and trust
    demo. Reached only through an on-behalf-of assertion from a trusted
    delegating agent. It verifies that assertion, then mints its OWN AgentID
    token for the MCP call, so the scopes the gateway authorizes come from this
    agent's AMP roles rather than from anything the caller asserted.
servers:
  - url: /
paths:
  /settle:
    post:
      summary: Settle a payment against an opaque vault reference
      security:
        - oboAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequest'
      responses:
        '200':
          description: The settlement outcome and the hops it took
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
  /whoami:
    get:
      summary: This agent's AMP identity, granted scopes and MCP gateway endpoint
      responses:
        '200':
          description: Identity summary
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  service: {type: string}
components:
  securitySchemes:
    oboAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        On-behalf-of assertion minted by the delegating agent. Carries the user
        as `sub`, the delegating agent as `act.sub`, this agent as `aud`, the
        narrowed scope and the delegation chain.
  schemas:
    SettleRequest:
      type: object
      properties:
        amount: {type: number, default: 249.00}
        payment_ref:
          type: string
          default: tok_card_9931
          description: Opaque vault reference. A card number here is refused by a guardrail.
        trace_id: {type: string}
    SettleResponse:
      type: object
      properties:
        status: {type: string}
        agent: {type: string}
        trace_id: {type: string}
        acting_for: {type: string}
        delegation_chain:
          type: array
          items: {type: string}
        payment_ref_used: {type: string}
        card_number_seen_by_agent:
          type: string
          nullable: true
        receipt: {type: object}
        steps:
          type: array
          items: {type: object}
